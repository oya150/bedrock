site_name: bedrock
site_description: 더 쪼갤 수 없는 바닥까지 파 내려가는 개발 백과
site_url: https://oya150.github.io/bedrock/
repo_url: https://github.com/oya150/bedrock
edit_uri: edit/main/docs/
copyright: © 2026 oya150

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 밝은 화면으로

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 처음: index.md
  - 컴퓨터:
      - computer/index.md
      - 1. 컴퓨터는 무엇을 할 줄 아나요: computer/01-what-computers-do.md
      - 2. 컴퓨터는 사진을 어떻게 기억하나요: computer/02-how-computers-keep-pictures.md
      - 3. 컴퓨터는 글자를 어떻게 기억하나요: computer/03-how-computers-keep-letters.md
      - 4. 컴퓨터 속 숫자는 어떻게 생겼나요: computer/04-what-numbers-look-like.md
      - 5. 컴퓨터는 어디에 기억해 두나요: computer/05-where-computers-remember.md
  - 알고리즘:
      - algorithms/index.md
      - 1. 빅오는 왜 필요할까요: algorithms/01-why-big-o.md
