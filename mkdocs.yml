site_name: bedrock
site_description: 더 쪼갤 수 없는 바닥까지 파 내려가는 개발 백과
site_url: https://oya150.github.io/bedrock/
repo_url: https://github.com/oya150/bedrock
edit_uri: edit/main/docs/
copyright: © 2026 oya150

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 밝은 화면으로

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 처음: index.md
  - 컴퓨터:
      - computer/index.md
      - 1. 컴퓨터는 무엇을 할 줄 아나요: computer/01-what-computers-do.md
      - 2. 컴퓨터는 사진을 어떻게 기억하나요: computer/02-how-computers-keep-pictures.md
      - 3. 컴퓨터는 글자를 어떻게 기억하나요: computer/03-how-computers-keep-letters.md
      - 4. 컴퓨터 속 숫자는 어떻게 생겼나요: computer/04-what-numbers-look-like.md
      - 5. 컴퓨터는 어디에 기억해 두나요: computer/05-where-computers-remember.md
      - 6. 컴퓨터에게 일을 어떻게 시키나요: computer/06-how-to-tell-computers.md
      - 7. 컴퓨터도 틀릴까요: computer/07-can-computers-be-wrong.md
      - 8. 영상은 어떻게 움직일까요: computer/08-how-videos-move.md
      - 9. 내가 누른 걸 컴퓨터는 어떻게 알까요: computer/09-how-touch-works.md
      - 10. 남이 봐도 못 읽는 메시지는 어떻게 만들까요: computer/10-how-to-keep-messages-secret.md
      - 11. 메시지는 어떤 길로 갈까요: computer/11-how-messages-travel.md
      - 12. 검색하면 어떻게 바로 찾을까요: computer/12-how-search-works.md
  - 알고리즘:
      - algorithms/index.md
      - 1. 양말이 두 배면 일은 몇 배가 될까요: algorithms/01-why-big-o.md
      - 2. 사물함은 왜 몇 번 칸이든 바로 찾을까요: algorithms/02-why-arrays-are-fast.md
      - 3. 업다운 놀이는 왜 금방 맞힐까요: algorithms/03-why-sorted-is-fast.md
      - 4. 손에 든 카드는 어떻게 정리할까요: algorithms/04-insertion-sort.md
      - 5. 카드를 반씩 나눠 정리하면 왜 빠를까요: algorithms/05-merge-sort.md
      - 6. 기준 카드 하나로 나누면 어떻게 정렬될까요: algorithms/06-quick-sort.md
      - 7. 파이썬은 카드를 어떻게 정렬할까요: algorithms/07-timsort.md
      - 8. 비교하지 않고 정렬할 수 있을까요: algorithms/08-counting-sort.md
      - 9. 이름으로 어떻게 바로 찾을까요: algorithms/09-hash.md
      - 10. 가장 급한 것을 어떻게 늘 빨리 꺼낼까요: algorithms/10-heap.md
      - 11. 창고 속 카드는 어떻게 빨리 찾을까요: algorithms/11-btree.md
      - 12. 친구의 친구까지 빠짐없이 찾으려면: algorithms/12-bfs-dfs.md
  - 인체:
      - body/index.md
      - 1. 우리 몸은 무엇으로 만들어졌을까요: body/01-cells.md
      - 2. 숨은 왜 쉬지 않고 쉴까요: body/02-breathing.md
      - 3. 밥을 먹으면 어디로 갈까요: body/03-digestion.md
      - 4. 피는 왜 온몸을 돌까요: body/04-blood.md
      - 5. 심장은 왜 쉬지 않고 뛸까요: body/05-heart.md
      - 6. 다치면 피는 어떻게 멈출까요: body/06-clotting.md
      - 7. 땀은 왜 날까요? 모공은 왜 있을까요: body/07-sweat.md
      - 8. 손톱과 머리카락은 왜 잘라도 안 아플까요: body/08-nails-hair.md
      - 9. 뼈와 근육은 어떻게 몸을 움직일까요: body/09-bones-muscles.md
      - 10. 눈은 어떻게 볼까요: body/10-eyes.md
      - 11. 뇌는 어떻게 몸에 명령할까요: body/11-brain.md
      - 12. 감기에 걸리면 몸은 어떻게 싸울까요: body/12-immune.md
  - 물질과 에너지:
      - matter/index.md
      - 1. 물, 돌, 공기는 무엇으로 되어 있을까요: matter/01-particles.md
      - 2. 얼음, 물, 김은 왜 모양이 다를까요: matter/02-states.md
