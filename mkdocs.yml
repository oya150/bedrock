site_name: bedrock
site_description: 더 쪼갤 수 없는 바닥까지 파 내려가는 개발 백과
site_url: https://oya150.github.io/bedrock/
repo_url: https://github.com/oya150/bedrock
edit_uri: edit/main/docs/
copyright: © 2026 oya150

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 밝은 화면으로

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 처음: index.md
  - 알고리즘:
      - algorithms/index.md
      - 1. 빅오는 왜 필요할까요: algorithms/01-why-big-o.md
